[project]
name = "spectre"
version = "0.5"
description = "GPU-accelerated Parallel quantitative trading library"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Zhang Jianhao", email = "heeroz@gmail.com" }]
keywords = ["quantitative", "analysis", "backtesting", "parallel", "algorithmic", "trading"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "bs4>=0.0.2",
    "lxml>=6.1",
    "numpy>=2.5",
    "pandas>=3.1",
    "plotly>=7.1",
    "pyarrow>=26.0",
    "requests>=2.34",
    "torch>=2.15",
    "tqdm>=4.70",
]

[project.urls]
Homepage = "https://github.com/Heerozh/spectre"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-xdist>=3.8",
    "ruff>=0.17.3",
    "scipy>=1.18",
]
# These two only pick the torch build, see `tool.uv.sources`. `cuda` is on by default, select the
# CPU build with `--no-group cuda --group cpu`. Groups are not part of the built package.
cuda = ["torch"]
cpu = ["torch"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev", "cuda"]
conflicts = [[{ group = "cpu" }, { group = "cuda" }]]

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
torch = [
    { index = "pytorch-cu134", group = "cuda", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform != 'darwin'" },
    # macOS has no CUDA builds. This has to bind `project.dependencies` rather than the groups,
    # or uv does not fork on the platform: it picks cu134 there, or fails a lock from scratch.
    { index = "pypi", marker = "sys_platform == 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true
markers = [
    "cuda: needs a CUDA device, skipped automatically when CUDA is not available.",
    "network: downloads data from the internet, only runs with --run-network.",
    "slow: takes minutes (TODO: split and simplify), only runs with --run-slow.",
    "external_data: needs data outside this repository, skipped if not found, see tests/README.md.",
]
filterwarnings = [
    # CsvDirLoader recommends float32 dtypes, the test data intentionally uses the defaults.
    "ignore:It is recommended to set the `dtype` parameter:RuntimeWarning",
]

[tool.ruff]
line-length = 100
extend-exclude = ["benchmarks"]

[tool.ruff.lint]
extend-select = ["E", "W", "F"]
ignore = [
    "C408",    # dict(a=1) reads better in plotly configs
    "PLR0124", # x != x is how this code checks for NaN
    "RUF012",  # class-level `inputs` are part of the factor API
    "RUF046",  # round() of a numpy or torch value is not always an int
    "TRY004",  # changing the exception type changes the API
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
